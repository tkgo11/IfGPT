name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python3 -m unittest -v test_chatbot.py test_validate_dataset.py

      - name: Validate corpus
        run: python3 validate_dataset.py

      - name: Chatbot smoke test
        run: python3 chatbot.py "hello" | grep -F "Hello."

      - name: Install lint/type tools
        run: python3 -m pip install ruff==0.16.7 mypy==2.3.1

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: python3 -m mypy
